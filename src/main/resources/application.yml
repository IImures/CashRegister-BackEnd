spring:
    config:
        import: optional:classpath:.env[.properties]
    application:
        name: cashregister
    datasource:
        url: jdbc:postgresql://localhost:5432/cash_register
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver
    jpa:
        open-in-view: true
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
              format_sql: true
    flyway:
        baseline-on-migrate: true


application:
    security:
        jwt:
            secret-key: ${SECRET_KEY}
            refresh-secret-key: ${REFRESH_SECRET_KEY}
            expiration-time: ${EXPIRATION_TIME}
            refresh-expiration-time: ${REFRESH_EXPIRATION_TIME}
        cors:
            allowed-origin: ${ALLOWED_ORIGIN}